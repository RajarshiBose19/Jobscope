<!DOCTYPE html><html><head><meta charset="utf-8"><title>Skill gaps</title>
<style>
  body{margin:0;font-family:ui-sans-serif,system-ui;background:#0e1116;color:#e6edf3;padding:12px}
  h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9aa4ad}
  .row{display:grid;grid-template-columns:130px 1fr 30px;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
  .name{text-align:right;color:#cad1ff}
  .bar-wrap{background:#161b22;border-radius:4px;height:18px;overflow:hidden}
  .bar{background:#e74c3c;height:100%;border-radius:4px;min-width:2px}
  .count{font-weight:600;text-align:right;color:#ffb0b6}
  .empty{padding:30px;color:#9aa4ad;font-size:13px;text-align:center}
</style></head><body>
<h3>Top missing required skills</h3>
<div id="rows"><div class="empty">Waiting for data…</div></div>
<script>
  window.addEventListener('jet:refresh', e => {
    const rows = (e.detail && e.detail.rows) || [];
    const out = document.getElementById('rows');
    if (!rows.length){ out.innerHTML = '<div class="empty">No skill-gap data yet.</div>'; return; }
    const maxN = Math.max.apply(null, rows.map(r => r.missing));
    out.innerHTML = rows.map(r => {
      const pct = Math.round(100 * r.missing / maxN);
      return '<div class="row"><div class="name">'+r.skill+'</div>'+
             '<div class="bar-wrap"><div class="bar" style="width:'+pct+'%"></div></div>'+
             '<div class="count">'+r.missing+'</div></div>';
    }).join('');
  });
</script></body></html>
